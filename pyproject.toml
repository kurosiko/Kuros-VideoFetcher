[project]
name = "videofetcher"
version = "2.0.0"
description = "A modern YouTube/video downloader with a sleek GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.2",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pystray>=0.5.0",
]

[project.optional-dependencies]
windows = [
    "win11toast>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
videofetcher = "videofetcher.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
